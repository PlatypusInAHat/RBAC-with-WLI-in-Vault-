<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>K8s Minimal Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, sans-serif; background: #f0f2f5; color: #1c1e21; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { width: 100%; max-width: 480px; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.08); }
        h1 { font-size: 1.25rem; margin-bottom: 24px; color: #1a73e8; display: flex; align-items: center; gap: 8px; }
        .status-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .item { padding: 12px; border-radius: 12px; background: #f8f9fa; border: 1px solid #f1f3f4; }
        .label { font-size: 0.7rem; color: #70757a; text-transform: uppercase; font-weight: 700; letter-spacing: 0.5px; display: block; margin-bottom: 4px; }
        .value { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 0.85rem; color: #202124; overflow: hidden; text-overflow: ellipsis; }
        .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: 700; margin-top: 4px; }
        .ok { background: #e6f4ea; color: #137333; }
        .err { background: #fce8e6; color: #c5221f; }
        .full { grid-column: span 2; }
        button { width: 100%; margin-top: 24px; padding: 12px; background: #1a73e8; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-weight: 600; transition: background 0.2s; }
        button:hover { background: #1557b0; }
        .loader { font-style: italic; color: #dadce0; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1><span>⚡</span> K8s Status</h1>
        <div class="status-grid" id="dashboard">
            <div class="item"><span class="label">Pod Name</span><div class="value" id="pod-name">...</div></div>
            <div class="item"><span class="label">Namespace</span><div class="value" id="namespace">...</div></div>
            <div class="item"><span class="label">Vault Agent</span><div id="vault-status" class="loader">Loading...</div></div>
            <div class="item"><span class="label">Database</span><div id="db-status" class="loader">Loading...</div></div>
            <div class="item"><span class="label">RBAC Read</span><div id="rbac-status" class="loader">Loading...</div></div>
            <div class="item"><span class="label">Vault Auth</span><div class="value" id="vault-auth">...</div></div>
            <div class="item full"><span class="label">Shared Secrets Found</span><div class="value" id="shared-list">...</div></div>
        </div>
        <button onclick="updateAll()">🔄 Refresh Dashboard</button>
    </div>

    <script>
        const fetchAPI = async (e) => {
            try {
                const r = await fetch(e, {cache: 'no-store'});
                return r.ok ? r.json() : null;
            } catch { return null; }
        };
        
        async function updateAll() {
            const btn = document.querySelector('button');
            btn.disabled = true;
            btn.textContent = 'Updating...';

            const [info, rbac, vault, db, secrets] = await Promise.all([
                fetchAPI('/api/info'), fetchAPI('/api/rbac'), fetchAPI('/api/vault'), 
                fetchAPI('/api/database'), fetchAPI('/api/secrets')
            ]);

            if (info) {
                document.getElementById('pod-name').textContent = info.podName?.split('-').pop() || 'err';
                document.getElementById('namespace').textContent = info.namespace || 'err';
            }
            
            const setStatus = (id, condition, okText, errText) => {
                const el = document.getElementById(id);
                el.innerHTML = condition 
                    ? `<span class="badge ok">${okText}</span>` 
                    : `<span class="badge err">${errText}</span>`;
            };

            setStatus('vault-status', vault?.vaultAgent?.injected, 'ACTIVE', 'MISSING');
            setStatus('db-status', db?.status === 'connected', 'ONLINE', 'OFFLINE');
            setStatus('rbac-status', rbac?.rbacPermissions?.canReadSecrets, 'ALLOWED', 'DENIED');
            
            if (vault) document.getElementById('vault-auth').textContent = vault.workloadIdentity?.authMethod || 'none';

            if (secrets) {
                const s = [];
                if (secrets.sharedSecrets?.encryptionKey !== 'not-set') s.push('encryption');
                if (secrets.sharedSecrets?.sessionSecret !== 'not-set') s.push('session');
                document.getElementById('shared-list').textContent = s.join(', ') || 'None found';
            }

            btn.disabled = false;
            btn.textContent = '🔄 Refresh Dashboard';
        }
        window.onload = updateAll;
    </script>
</body>
</html>
