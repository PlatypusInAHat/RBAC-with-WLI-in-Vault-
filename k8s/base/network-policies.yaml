# =========================
# 0) DEFAULT DENY (bloodbank)
# =========================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: bloodbank
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
# =========================
# 1) FRONTEND POLICY
# - Ingress: allow public -> port 3000
# - Egress : allow DNS + allow to backend:3000
# =========================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-netpol
  namespace: bloodbank
spec:
  podSelector:
    matchLabels:
      app: bloodbank
      component: frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from: []
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # DNS to kube-dns (UDP/TCP 53)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # Frontend -> Backend
    - to:
        - podSelector:
            matchLabels:
              app: bloodbank
              component: backend
      ports:
        - protocol: TCP
          port: 3000

---
# =========================
# 2) BACKEND POLICY
# - Ingress: allow from frontend -> 3000
# - Egress : allow DNS + allow to postgres:5432
# =========================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-netpol
  namespace: bloodbank
spec:
  podSelector:
    matchLabels:
      app: bloodbank
      component: backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: bloodbank
              component: frontend
      ports:
        - protocol: TCP
          port: 3000

  egress:
    # DNS to kube-dns (UDP/TCP 53)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # Backend -> Postgres
    - to:
        - podSelector:
            matchLabels:
              app: bloodbank
              component: database
      ports:
        - protocol: TCP
          port: 5432

---
# =========================
# 3) POSTGRES POLICY
# - Ingress: allow from backend -> 5432
# - Egress : allow DNS only (optional but nice)
# =========================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-netpol
  namespace: bloodbank
spec:
  podSelector:
    matchLabels:
      app: bloodbank
      component: database
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: bloodbank
              component: backend
      ports:
        - protocol: TCP
          port: 5432

  egress:
    # DNS to kube-dns (UDP/TCP 53)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

---
# =========================
# 4) (OPTIONAL) ALLOW VAULT EGRESS
# Nếu app pods cần gọi Vault trực tiếp (8200) thì bật 2 policy này.
# Nếu chỉ dùng Vault Agent Injector sidecar mà không gọi Vault từ app, có thể bỏ.
# =========================
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-vault-egress-from-bloodbank
  namespace: bloodbank
spec:
  podSelector:
    matchLabels:
      app: bloodbank
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: vault
          podSelector:
            matchLabels:
              app: vault
      ports:
        - protocol: TCP
          port: 8200

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-bloodbank-to-vault-ingress
  namespace: vault
spec:
  podSelector:
    matchLabels:
      app: vault
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: bloodbank
      ports:
        - protocol: TCP
          port: 8200
