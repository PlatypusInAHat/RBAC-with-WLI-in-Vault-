---
# ConfigMap for Backend configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: prj
  labels:
    app: prj
    component: backend
data:
  NODE_ENV: "production"
  PORT: "3000"

  # Database configuration
  DB_HOST: "postgres.prj.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "blood_bank"

---
# Deployment for Backend API
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: prj
  labels:
    app: prj
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: prj
      component: backend
  template:
    metadata:
      labels:
        app: prj
        component: backend
      annotations:
        # Vault Agent Injector - Auto-inject secrets
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "prj-backend"

        # Inject database credentials
        vault.hashicorp.com/agent-inject-secret-database: "secret/data/prj/database"
        vault.hashicorp.com/agent-inject-template-database: |
          {{- with secret "secret/data/prj/database" -}}
          export DB_USER="{{ .Data.data.username }}"
          export DB_PASSWORD="{{ .Data.data.password }}"
          export DB_HOST="{{ .Data.data.host }}"
          export DB_PORT="{{ .Data.data.port }}"
          export DB_NAME="{{ .Data.data.database }}"
          {{- end -}}

        # Inject backend secrets
        vault.hashicorp.com/agent-inject-secret-backend: "secret/data/prj/backend"
        vault.hashicorp.com/agent-inject-template-backend: |
          {{- with secret "secret/data/prj/backend" -}}
          export JWT_SECRET="{{ .Data.data.jwt_secret }}"
          export API_KEY="{{ .Data.data.api_key }}"
          {{- end -}}

        # Inject SHARED secrets
        vault.hashicorp.com/agent-inject-secret-shared: "secret/data/prj/shared"
        vault.hashicorp.com/agent-inject-template-shared: |
          {{- with secret "secret/data/prj/shared" -}}
          export ENCRYPTION_KEY="{{ .Data.data.encryption_key }}"
          export SESSION_SECRET="{{ .Data.data.session_secret }}"
          {{- end -}}
    spec:
      serviceAccountName: prj-backend-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: backend
          image: prj-backend:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: backend-config
          env:
            # Database credentials from Kubernetes Secret
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            # Backend secrets
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: jwt-secret
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secrets
                  key: api-key
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
