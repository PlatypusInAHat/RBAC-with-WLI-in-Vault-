---
# ConfigMap for Frontend ENV configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-config
  namespace: prj
  labels:
    app: prj
    component: frontend
data:
  NODE_ENV: "production"
  PORT: "3000"
  HOSTNAME: "0.0.0.0"
  # Khi dùng nginx proxy /api, FE nên gọi same-origin: /api/...
  NEXT_PUBLIC_BACKEND_URL: "/api"

---
# ConfigMap for Frontend Nginx reverse-proxy config (default.conf)
apiVersion: v1
kind: ConfigMap
metadata:
  name: frontend-nginx-conf
  namespace: prj
  labels:
    app: prj
    component: frontend
data:
  default.conf: |
    server {
      listen 3000;
      server_name _;

      root /usr/share/nginx/html;
      index index.html;

      # Proxy API -> backend nội bộ trong cluster
      location /api/ {
        proxy_pass http://backend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      }

      location / {
        try_files $uri $uri/ /index.html;
      }
    }

---
# Deployment for Frontend
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: prj
  labels:
    app: prj
    component: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: prj
      component: frontend
  template:
    metadata:
      labels:
        app: prj
        component: frontend
      annotations:
        # Vault Agent Injector - Auto-inject secrets
        vault.hashicorp.com/agent-inject: "true"
        vault.hashicorp.com/role: "prj-frontend"

        # Inject frontend secrets
        vault.hashicorp.com/agent-inject-secret-frontend: "secret/data/prj/frontend"
        vault.hashicorp.com/agent-inject-template-frontend: |
          {{- with secret "secret/data/prj/frontend" -}}
          export API_KEY="{{ .Data.data.api_key }}"
          export NEXT_PUBLIC_API_URL="{{ .Data.data.next_public_api_url }}"
          {{- end -}}

        # Inject SHARED secrets (same as backend!)
        vault.hashicorp.com/agent-inject-secret-shared: "secret/data/prj/shared"
        vault.hashicorp.com/agent-inject-template-shared: |
          {{- with secret "secret/data/prj/shared" -}}
          export ENCRYPTION_KEY="{{ .Data.data.encryption_key }}"
          export SESSION_SECRET="{{ .Data.data.session_secret }}"
          {{- end -}}
    spec:
      serviceAccountName: prj-frontend-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: frontend
          image: prj-frontend:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: frontend-config
          env:
            # Frontend secrets from Kubernetes Secret
            - name: NEXT_PUBLIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: frontend-secrets
                  key: api-key
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            # ✅ Mount nginx default.conf từ ConfigMap (không cần build lại image)
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        # ✅ Volume lấy từ ConfigMap nginx
        - name: nginx-conf
          configMap:
            name: frontend-nginx-conf
            items:
              - key: default.conf
                path: default.conf
